version: "3.8"

services:
  translation:
    build: ./translation_service
    container_name: translation
    restart: unless-stopped
    ports:
      - "5002:5002"
    networks:
      - ssnet

  similarity:
    build: ./similarity_service
    container_name: similarity
    restart: unless-stopped
    environment:
      TRANSLATION_BASE_URL: http://translation:5002
      EMBEDDING_MODEL: intfloat/e5-large
    ports:
      - "5001:5001"
    depends_on:
      - translation
    networks:
      - ssnet

  db:
    image: postgres:15
    container_name: summer-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bitirmedb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bitirmedb"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - ssnet

  web:
    build: .
    container_name: summer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/bitirmedb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SIMILARITY_API_URL: http://similarity:5001/similarity
    depends_on:
      db:
        condition: service_healthy
      similarity:
        condition: service_started
      translation:
        condition: service_started
    networks:
      - ssnet

networks:
  ssnet:
    driver: bridge