<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Şifre Değiştir</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .navbar {
            background-color: #333;
            overflow: visible !important;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between; /* merkeze değil, iki uca yasla */
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .navbar a, .dropbtn {
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            margin: 0 10px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .navbar a:hover {
            background-color: #555;
        }

        .dropdown {
            margin-left: auto;
            position: relative;
            display: flex;
            align-items: center;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            background-color: white;
            min-width: 160px;
            box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
            z-index: 1000;
        }

        .dropdown-content a {
            color: black;
            padding: 10px 16px;
            text-decoration: none;
            display: block;
        }

        .dropdown-content a:hover {
            background-color: #f1f1f1;
        }

        .dropdown-content.show {
            display: block;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        h1 {
            color: #333;
        }

        button {
            padding: 10px 15px;
            background-color: #007bff;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #0056b3;
        }

        .container form input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        .container form button[type="submit"] {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .error {
            color: red;
            font-size: 14px;
            display: none;
        }

        .success {
            color: green;
            font-size: 14px;
            display: none;
        }
    </style>
</head>
<body>

<div class="navbar">
    <div>
        <a href="/dashboard" th:if="${role == 'STUDENT' || role == 'COMMITTEE' || role == 'ADMIN'}">Dashboard</a>
        <a href="/applications/new" id="applyButton" th:if="${role == 'STUDENT' || role == 'ADMIN'}"
           th:classappend="${isPreviewMode == true or isApplicationPeriod == true ? '' : 'disabled-link'}"
           th:data-preview-mode="${isPreviewMode}" th:data-application-period="${isApplicationPeriod}"
           onclick="return checkApplicationPeriod();">
            Başvuru Yap
        </a>
        <a href="/applications/my-applications" th:if="${role == 'STUDENT' || role == 'ADMIN'}">Başvurularım</a>
        <a href="/applications/pending" th:if="${role == 'COMMITTEE' || role == 'ADMIN'}">Bekleyen Başvurular</a>
        <a href="/applications/approved" th:if="${role == 'COMMITTEE' || role == 'ADMIN'}">Onaylanan Başvurular</a>
        <a href="/applications/rejected" th:if="${role == 'COMMITTEE' || role == 'ADMIN'}">Reddedilen Başvurular</a>
        <a href="/settings" th:if="${role == 'COMMITTEE'|| role == 'ADMIN'}">Ayarlar</a>
    </div>

    <div class="dropdown" style="margin-left:auto; position: relative;">
        <button class="dropbtn" onclick="toggleDropdown()" id="userDropdownBtn">
            <span id="usernameText" th:text="${user.username}">Kullanıcı</span> &#9662;
        </button>
        <div id="userDropdown" class="dropdown-content">
            <a href="/profile">Profil Sayfası</a>
            <a href="/change-password">Şifre Değiştir</a>
            <a href="/logout">Çıkış Yap</a>
        </div>
    </div>
</div>

<div class="container">
    <h2>Şifre Değiştir</h2>
    <form th:action="@{/change-password}" method="post" onsubmit="return validatePasswords()">
        <input type="password" name="currentPassword" placeholder="Mevcut Şifre" required/>
        <input type="password" id="newPassword" name="newPassword" placeholder="Yeni Şifre" required/>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Yeni Şifre (Tekrar)" required/>
        <div id="error" class="error">Yeni şifreler uyuşmuyor!</div>
        <div id="success" class="success" th:if="${successMessage}" th:text="${successMessage}"></div>
        <div class="error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
        <button type="submit">Şifreyi Güncelle</button>
    </form>
</div>

<script>
    function validatePasswords() {
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (newPassword !== confirmPassword) {
            document.getElementById('error').style.display = 'block';
            return false;
        }

        return true;
    }

    function toggleDropdown() {
        document.getElementById("userDropdown").classList.toggle("show");
    }

    window.onclick = function (event) {
        const button = document.getElementById("userDropdownBtn");
        if (!button.contains(event.target)) {
            document.getElementById("userDropdown").classList.remove("show");
        }
    }
</script>
</body>
</html>
