<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .navbar {
            background-color: #333;
            overflow: visible !important;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between; /* merkeze değil, iki uca yasla */
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            margin: 0 10px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .navbar a:hover {
            background-color: #555;
        }

        .dropdown {
            margin-left: auto;
            position: relative;
            display: flex;
            align-items: center;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            background-color: white;
            min-width: 160px;
            box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
            z-index: 1000;
        }

        .dropdown-content a {
            color: black;
            padding: 10px 16px;
            text-decoration: none;
            display: block;
        }

        .dropdown-content a:hover {
            background-color: #f1f1f1;
        }

        .dropdown-content.show {
            display: block;
        }

        .dropbtn {
            background-color: #007bff; /* Mavi arka plan */
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .status-info {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }

        h1 {
            color: #333;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
        }

        .modal-content {
            background-color: white;
            margin: 15% auto;
            padding: 20px;
            width: 40%;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .close {
            color: red;
            float: right;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
        }

        button {
            padding: 10px 15px;
            background-color: #007bff;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #0056b3;
        }

        .alert {
            background-color: #ffcccc;
            color: #721c24;
            padding: 15px;
            margin: 10px auto;
            border-radius: 5px;
            text-align: center;
            width: 80%;
            display: none;
        }

        .close-btn {
            margin-left: 10px;
            cursor: pointer;
            font-weight: bold;
            color: red;
        }
    </style>
</head>
<body>
<!-- Kullanıcının rolünü saklayan gizli bir alan -->
<input type="hidden" id="userRole" th:value="${role}"/>

<!-- Navbar -->
<div class="navbar">
    <div>
        <a href="/dashboard" th:if="${role == 'STUDENT' || role == 'COMMITTEE' || role == 'ADMIN'}">Dashboard</a>
        <a href="/applications/new" id="applyButton" th:if="${role == 'STUDENT' || role == 'ADMIN'}"
           th:classappend="${isPreviewMode or isApplicationPeriod ? '' : 'disabled-link'}"
           th:data-preview-mode="${isPreviewMode}" th:data-application-period="${isApplicationPeriod}"
           onclick="return checkApplicationPeriod();">
            Başvuru Yap
        </a>
        <a href="/applications/my-applications" th:if="${role == 'STUDENT' || role == 'ADMIN'}">Başvurularım</a>
        <a href="/applications/pending" th:if="${role == 'COMMITTEE' || role == 'ADMIN'}">Bekleyen Başvurular</a>
        <a href="/applications/approved" th:if="${role == 'COMMITTEE' || role == 'ADMIN'}">Onaylanan Başvurular</a>
        <a href="/applications/rejected" th:if="${role == 'COMMITTEE' || role == 'ADMIN'}">Reddedilen Başvurular</a>
        <a href="/settings" th:if="${role == 'COMMITTEE'|| role == 'ADMIN'}">Ayarlar</a>
    </div>

    <div class="dropdown" style="margin-left:auto; position: relative;">
        <button class="dropbtn" onclick="toggleDropdown()" id="userDropdownBtn">
            <span id="usernameText" th:text="${username}">Kullanıcı</span> &#9662;
        </button>
        <div id="userDropdown" class="dropdown-content">
            <a href="/profile">Profil Sayfası</a>
            <a href="/change-password">Şifre Değiştir</a>
            <a href="/logout">Çıkış Yap</a>
        </div>
    </div>
</div>

<!-- Hata mesajını göster -->
<div class="alert" th:if="${errorMessage}" id="errorAlert">
    <span th:text="${errorMessage}"></span>
    <span class="close-btn" onclick="closeAlert()">&times;</span>
</div>

<!-- Dashboard İçeriği -->
<div class="container">
    <h1>Hoş Geldiniz, <span th:text="${fullName}"></span></h1>
    <p>Başvurularınızı yönetebilirsiniz.</p>
</div>

<!-- Hata Mesajı İçin Pop-up -->
<div id="errorPopup" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closePopup()">&times;</span>
        <h2>Başvuru Yapılamaz!</h2>
        <p id="errorMessage">Başvurular şu anda kapalıdır. Lütfen belirlenen tarihlerde tekrar deneyin.</p>
        <button onclick="closePopup()">Tamam</button>
    </div>
</div>

<script>
    function checkApplicationPeriod() {
        let applyButton = document.getElementById("applyButton");

        let isPreviewMode = applyButton.getAttribute("data-preview-mode") === "true";
        let isApplicationPeriod = applyButton.getAttribute("data-application-period") === "true";

        console.log("Kontrol - isPreviewMode:", isPreviewMode);
        console.log("Kontrol - isApplicationPeriod:", isApplicationPeriod);

        if (isApplicationPeriod || isPreviewMode) {
            return true;
        }

        document.getElementById("errorMessage").innerText = "Başvurular şu anda kapalıdır. Lütfen belirlenen tarihlerde tekrar deneyin.";
        document.getElementById("errorPopup").style.display = "block";
        return false;
    }

    function closePopup() {
        document.getElementById("errorPopup").style.display = "none";
    }

    function closeAlert() {
        document.getElementById("errorAlert").style.display = "none";
    }

    window.onload = function () {
        let role = document.getElementById("userRole").value;

        if (!role || (role !== "STUDENT" && role !== "COMMITTEE" && role !== "ADMIN")) {
            alert("Yetkisiz erişim! Lütfen giriş yapın.");
            window.location.href = "/login";
        }

        let alertBox = document.getElementById("errorAlert");
        if (alertBox && alertBox.innerText.trim() !== "") {
            alertBox.style.display = "block";
        }
    };

    function toggleDropdown() {
        document.getElementById("userDropdown").classList.toggle("show");
    }

    // Sayfanın herhangi bir yerine tıklanırsa menüyü kapat
    window.onclick = function (event) {
        const button = document.getElementById("userDropdownBtn");
        if (!button.contains(event.target)) {
            document.getElementById("userDropdown").classList.remove("show");
        }
    }
</script>

</body>
</html>
