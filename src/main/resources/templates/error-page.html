<!DOCTYPE html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Hata Sayfası</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      text-align: center;
      padding-top: 100px;
    }
    .container {
      background-color: #fff;
      padding: 30px;
      border-radius: 10px;
      display: inline-block;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    h1 {
      color: red;
    }
    p {
      margin: 15px 0;
    }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #007bff;
      color: white;
      border-radius: 5px;
      text-decoration: none;
    }
  </style>
</head>
<body>
<div class="container">
  <h1 th:text="'Hata Kodu: ' + ${errorCode}"></h1>
  <p th:text="${errorMessage}">Beklenmeyen bir hata oluştu.</p>
  <a href="/dashboard">Ana Sayfa'ya Dön</a>
</div>
</body>
</html>
